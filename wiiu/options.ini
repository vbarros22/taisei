[project options]
r_default = 'gl33'
r_gl33 = 'enabled'
r_gles30 = 'disabled'
r_null = 'enabled'
a_default = 'sdl'
shader_transpiler = 'disabled'
validate_glsl = 'disabled'
# One zip on the SD card instead of thousands of files: each file
# opened on the SD card costs milliseconds.
vfs_zip = 'enabled'
package_data = 'enabled'
tests = 'disabled'
docs = 'disabled'
use_libcrypto = 'disabled'
gamemode = 'disabled'

